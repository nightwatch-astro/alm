name: CI

# Feature 037 — automated real-stack verification on every change.
# - integration: Layer-1 real-backend integration + lint + bindings-drift gate,
#   REQUIRED on Windows, Linux, and macOS (FR-012).
# - ui-e2e: fast mock-mode Playwright UI regression.
# Real UI->IPC->backend E2E (thirtyfour + cargo-nextest) lives in e2e.yml and
# runs on ALL three OS via tauri-plugin-webdriver (Choochmeque) embedded in
# desktop_shell under the `e2e` feature flag — no external per-OS WebDriver
# binary required. WebdriverIO has been retired.
#
# Path-aware gating (see the `changes` job): work that a change cannot affect is
# skipped. Full-suite triggers (workflows, Cargo/lockfiles, package manifests,
# justfile, scripts) force everything to run via `force_full`.
#
# A job that would have NOTHING meaningful left to do must be skipped at JOB
# level, never step-by-step. A job whose every step is skipped still concludes
# `success`, making "this passed" and "this never ran" indistinguishable in the
# UI, the checks API and to automated pollers. A job skipped by a job-level
# `if:` concludes `skipped` — a distinct conclusion that still lets a docs-only
# PR merge. Step-level `if:` is legitimate only where the job as a whole still
# runs real work (the `integration` matrix interleaves a Rust lane and a
# frontend lane; its job-level gate fires only when BOTH lanes are idle).

# Least-privilege GITHUB_TOKEN. Without this block the token inherits the
# repository or organisation default, which may grant write scopes these jobs
# never use. Every job here only reads the repo and uploads artifacts, and
# `actions/upload-artifact` needs no `contents: write` -- it writes to the
# Actions artifact store, not to git. Mirrors release-gate.yml, which already
# declares `contents: read` (astro-plan-j14r).
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  # Required for the merge queue. A queued PR waits on the same contexts branch
  # protection requires; a workflow that does not trigger on `merge_group`
  # publishes none of them, so the entry never resolves and the queue stalls
  # instead of failing. The `changes` job needs no adjustment: dorny/paths-filter
  # v4 handles this event by diffing `merge_group.base_sha..head_sha` (v3 has no
  # merge_group branch at all), so path gating scopes to the queued changes
  # rather than the whole tree.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches, but never on `main` (#1203).
  #
  # Every main push shares one concurrency group, because `github.ref` is
  # `refs/heads/main` for all of them. A blanket `true` therefore made each
  # merge cancel the previous merge's run, and during a merge campaign no main
  # run survived to report: `6e624adc` and `67f48ee9` landed five minutes apart
  # and both concluded `cancelled,cancelled`.
  #
  # That silently emptied main's gate for unit, integration and mock-mode UI —
  # the suites this workflow owns. It is worse than a plain outage because it is
  # merge-rate dependent: when merges space out a run completes and main looks
  # green, so the gap only opens during periods of highest change velocity,
  # which is exactly when verification matters most.
  #
  # e2e.yml took the same fix in #1268; this is the other half.
  #
  # `cancelled` still appears on main, and that is expected — not a regression
  # of #1203. With `false`, GitHub keeps the in-flight run plus ONE queued run
  # per group and evicts intermediate pending runs. Measured on main minutes
  # after this landed: `f3668b86` survived while `89025366`, `b37b072e` and
  # `30e29bd1` were each evicted while queued.
  #
  # So the guarantee is "main always has a recent run that completes", NOT
  # "every main commit is verified". Individual intermediate commits can still
  # go unverified when merges land seconds apart. That is the bounded cost that
  # keeps this from serialising the queue indefinitely.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Incremental artifacts are not reusable across CI runs and only bloat the cache.
env:
  CARGO_INCREMENTAL: 0
  # Debuginfo is 53% of every compiled artifact and the runners have been
  # exhausting disk on it: `target/debug` reaches 1.1 GB, the 11 e2e journey
  # binaries total 356 MB (~32 MB each, 15.3 MB after `strip --strip-debug`),
  # and that archive is then downloaded by six shard jobs. PR #1216's ubuntu
  # leg died with `rustc-LLVM ERROR: IO failure on output stream: No space left
  # on device`, which reads as a code failure and costs real triage time.
  #
  # `line-tables-only` keeps file/line information in panic backtraces -- the
  # part that actually matters when a test or journey fails -- while dropping
  # the type and variable debuginfo that dominates the size. A full strip would
  # be smaller still but loses backtrace line numbers, a bad trade for a test
  # suite. Set here rather than as a `[profile.*]` in Cargo.toml so local
  # developer builds keep full debuginfo. See issue #1250.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Cheap change-detection gate (dorny/paths-filter). Downstream jobs read its
  # outputs to decide which heavy steps to run. Outputs:
  #   rust      — run Rust steps (a *.rs / crate / src-tauri / tests change, OR
  #               any force_full trigger).
  #   frontend  — run frontend steps (a TS/TSX/CSS / desktop-src / packages
  #               change, OR any force_full trigger).
  #   docs_only — informational: the change touched only docs and nothing that
  #               drives Rust or frontend. No longer used as a gate; consumed
  #               by the integration-idle step output for diagnostics.
  #   scripts   — a scripts/** change (drives the DB-boundary ratchet).
  #   all_files — CSV of every changed path, consumed by the changed-crate
  #               scoping step for `cargo test -p`.
  changes:
    name: Detect changes (CI)
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      frontend: ${{ steps.decide.outputs.frontend }}
      frontend_full: ${{ steps.decide.outputs.frontend_full }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
      scripts: ${{ steps.filter.outputs.scripts }}
      spec_contracts: ${{ steps.filter.outputs.spec_contracts }}
      all_files: ${{ steps.filter.outputs.all_files }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: csv
          filters: |
            all:
              - '**'
            # force_full, split per lane: a dependency-graph change forces only
            # the lane whose graph moved. A Cargo.lock bump does not invalidate
            # the frontend suite, and a pnpm-lock.yaml bump does not invalidate
            # the Rust suite. Shared drivers still force BOTH, because they can
            # change how either lane executes.
            #
            # Deliberately NOT '.github/workflows/**': editing e2e.yml or
            # release-please.yml cannot change how ci.yml runs its lanes, and
            # treating every workflow edit as a full-suite trigger is what made
            # a Rust-only refactor (#1169) run the entire frontend suite.
            force_full_shared:
              - 'justfile'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            force_full_rust:
              - '**/Cargo.toml'
              - 'Cargo.lock'
            force_full_frontend:
              - '**/package.json'
              - 'pnpm-lock.yaml'
            # Frontend inputs the vitest module graph cannot see, so `vitest
            # related` would silently skip tests that depend on them: runner
            # config, the setup file, global styles/tokens, the i18n
            # catalogues, and the shared packages consumed via bindings.
            frontend_full:
              - 'apps/desktop/vitest.config.ts'
              - 'apps/desktop/vite.config.ts'
              - 'apps/desktop/vitest.setup.ts'
              - 'apps/desktop/tsconfig*.json'
              - 'apps/desktop/src/styles/**'
              - 'apps/desktop/messages/**'
              - 'packages/**'
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'tests/**'
              - '**/*.rs'
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/desktop/public/**'
              - 'apps/desktop/index.html'
              - 'packages/**'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
            scripts:
              - 'scripts/**'
            # Feeds the TypeScript declaration generator, so it has to trigger
            # the drift gate. Narrower than `docs`, which would put a
            # Rust-compiling gate behind every markdown edit.
            spec_contracts:
              - 'specs/*/contracts/**'
            docs:
              - 'docs/**'
              - 'e2e-agentic-test/**'
              - 'specs/**'
              - '**/*.md'
              - '.apm/**'
              - 'PRODUCT.md'
              - 'CLAUDE.md'
              - 'AGENTS.md'
      - id: decide
        shell: bash
        run: |
          shared="${{ steps.filter.outputs.force_full_shared }}"
          rust=false
          frontend=false
          if [ "$shared" = "true" ] || [ "${{ steps.filter.outputs.force_full_rust }}" = "true" ] || [ "${{ steps.filter.outputs.rust }}" = "true" ]; then
            rust=true
          fi
          # `frontend_full` activates the frontend lane as well as widening it.
          # The two were independent, which was incoherent: an i18n catalogue
          # change (`apps/desktop/messages/**`, JSON — matched by frontend_full
          # but by no other frontend pattern) set frontend_full=true while
          # leaving the lane off, so the flag asked for every frontend spec while
          # no frontend step ran at all. It also activated no lane, which made
          # such a PR unmergeable for the same reason described below.
          if [ "$shared" = "true" ] || [ "${{ steps.filter.outputs.force_full_frontend }}" = "true" ] || [ "${{ steps.filter.outputs.frontend }}" = "true" ] || [ "${{ steps.filter.outputs.frontend_full }}" = "true" ]; then
            frontend=true
          fi
          # Fail closed on paths no filter recognises. The filter list is an
          # allowlist of things we know how to classify; a path matching none of
          # them is not evidence that nothing can break, it is evidence that we
          # do not know. `apps/desktop/scripts/*.mjs` (the token generator) and
          # `.design-sync/**` both land here today.
          #
          # Without this, such a change activates no lane, so `integration` is
          # skipped and its required contexts are never published — the PR is
          # unmergeable. Treating the unknown as "run everything" makes it both
          # mergeable and actually tested, instead of green because nothing ran.
          # Every meaningful filter counts as "recognised", including the
          # force_full_* ones. Omitting them would drag a Cargo.lock bump — which
          # matches force_full_rust but not `rust` — into the catch-all and run
          # the frontend suite too, exactly the lane separation the filter
          # comments above argue for.
          if [ "${{ steps.filter.outputs.all }}" = "true" ] \
            && [ "${{ steps.filter.outputs.rust }}" != "true" ] \
            && [ "${{ steps.filter.outputs.frontend }}" != "true" ] \
            && [ "${{ steps.filter.outputs.frontend_full }}" != "true" ] \
            && [ "${{ steps.filter.outputs.force_full_shared }}" != "true" ] \
            && [ "${{ steps.filter.outputs.force_full_rust }}" != "true" ] \
            && [ "${{ steps.filter.outputs.force_full_frontend }}" != "true" ] \
            && [ "${{ steps.filter.outputs.scripts }}" != "true" ] \
            && [ "${{ steps.filter.outputs.docs }}" != "true" ]; then
            echo "::notice::No path filter matched this change; running both lanes rather than assuming it is inert."
            rust=true
            frontend=true
          fi
          # frontend_full: run every vitest spec rather than the `related`
          # subset. Any shared driver or lockfile change, or a frontend input
          # invisible to the module graph, disables scoping.
          frontend_full=false
          if [ "$shared" = "true" ] \
            || [ "${{ steps.filter.outputs.force_full_frontend }}" = "true" ] \
            || [ "${{ steps.filter.outputs.frontend_full }}" = "true" ]; then
            frontend_full=true
          fi
          # docs_only: at least one doc changed and nothing drives Rust/frontend.
          docs_only=false
          if [ "$rust" = "false" ] && [ "$frontend" = "false" ] && [ "${{ steps.filter.outputs.docs }}" = "true" ]; then
            docs_only=true
          fi
          {
            echo "rust=$rust"
            echo "frontend=$frontend"
            echo "frontend_full=$frontend_full"
            echo "docs_only=$docs_only"
          } >> "$GITHUB_OUTPUT"
          echo "changes: rust=$rust frontend=$frontend frontend_full=$frontend_full docs_only=$docs_only scripts=${{ steps.filter.outputs.scripts }}"

      # This job is the only one with no gate, which is what the guard needs: a
      # PR that reintroduces an ignore rule for `.github/` may touch nothing
      # else, and every other job would skip it. The check is a `git ls-files`
      # plus one `git check-ignore`, so it costs nothing here.
      - name: Workflows visible to ignore-respecting scanners
        run: bash scripts/check-github-not-ignored.sh

  # Three lanes share this matrix (Rust, frontend, scripts), each with its own
  # step-level gate, so it is NOT split into separate jobs. The job-level gate
  # below fires only when ALL lanes are idle -- the case where the job had
  # nothing to do at all, handled by the `integration-idle` shim so the required
  # contexts still appear.
  #
  # `scripts` must appear here as well as on the ratchet steps: those steps gate
  # on it, so without it a scripts-only PR skips this job entirely and silently
  # bypasses every ratchet it was meant to trigger.
  #
  # Per-leg work is asymmetric, and deliberately so. `Rust tests` is the only
  # step that must run on all three platforms (real SQLite, real migrations,
  # per-OS path semantics). Every frontend step and every OS-agnostic Rust step
  # (fmt, clippy, doctests, generated drift, the ratchets) is Linux-only, so a
  # frontend-only change leaves the macOS and Windows legs with no real work.
  # Those legs then run the explicit no-op notice step at the end of this job
  # rather than reporting a bare green that looks like it tested something.
  integration:
    name: Unit + integration (L1+L2) — ${{ matrix.os }}
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.scripts == 'true' || needs.changes.outputs.spec_contracts == 'true'
    strategy:
      fail-fast: false # report each platform distinctly (FR-011)
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's desktop_shell crate needs system webview libs to build on Linux.
      - name: Install Tauri Linux system deps
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@1.98.0
        if: needs.changes.outputs.rust == 'true'
        with:
          components: rustfmt, clippy

      # shared-key lets jobs on the same OS reuse one warm cache. cache-on-failure
      # is intentionally left at its default (false): a cancelled or killed job
      # (e.g. from this workflow's cancel-in-progress concurrency group) can leave
      # a torn/partial target/ dir, and saving that on failure/cancellation poisons
      # the shared cache for every subsequent PR that restores it. On Windows this
      # previously manifested as a permanently-cached, half-linked
      # `commands-*.exe` failing every run with STATUS_ENTRYPOINT_NOT_FOUND
      # (0xc0000139) until the cache key below was bumped to escape it.
      # If this key is ever bumped again to escape a similarly poisoned cache,
      # also purge the stale `v0-rust-rust-windows-latest-*` entries via
      # `gh cache list` / `gh cache delete` so open PRs stop restoring them.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          shared-key: "rust-${{ matrix.os }}-v2"

      - uses: pnpm/action-setup@v6
        if: >-
          needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.spec_contracts == 'true'
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        if: >-
          needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.spec_contracts == 'true'
        with:
          node-version: 24
          cache: pnpm

      # `just` drives the DB-boundary ratchet, the generated-drift gate, and the
      # no-Rust contract-declaration drift gate below. That last one runs on the
      # frontend and spec-contract lanes, so gating this install on `rust` alone
      # left it calling a `just` that was never installed.
      - uses: taiki-e/install-action@v2
        if: >-
          needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.spec_contracts == 'true'
        with:
          tool: just,nextest

      - name: Install JS deps
        if: >-
          needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.spec_contracts == 'true'
        run: pnpm install --frozen-lockfile

      # Vite's dependency-optimizer output. Restored AFTER `pnpm install`
      # because it lives inside `node_modules/`, which the install recreates.
      #
      # Without it every run pays a cold optimize+transform for all ~200 test
      # files at once. That storm is not merely slow: vitest's `testTimeout`
      # clock starts when a test is scheduled, not when it gets a worker, so
      # a cold run charges queue time against unrelated tests and fails them
      # on timeout (observed locally: 21s transform vs the 15s timeout, two
      # suites red; both pass in isolation and pass warm).
      #
      # Vite validates this cache against its own hash of the lockfile and
      # config and re-optimizes on mismatch, so a stale restore degrades to
      # today's cold behaviour rather than serving wrong modules. The key
      # mirrors those same inputs so the common case is a clean hit.
      # Linux-only, matching the vitest step this cache exists to warm.
      - name: Cache Vite transform/deps output
        if: runner.os == 'Linux' && needs.changes.outputs.frontend == 'true'
        uses: actions/cache@v4
        with:
          path: apps/desktop/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/vite.config.ts', 'apps/desktop/vitest.config.ts') }}
          restore-keys: |
            vite-${{ runner.os }}-

      # --- Fast checks first (FR-012) ---
      # Keep locale parity as a named CI gate, independent of the broader lint
      # summary. The check is fast and its failure tells a catalogue author
      # exactly which missing or orphaned keys must be corrected.
      - name: Locale catalogue parity
        if: needs.changes.outputs.frontend == 'true' && matrix.os == 'ubuntu-latest'
        run: pnpm --filter @astro-plan/desktop run lint:i18n-drift

      # Frontend lint gate: Biome (format check + syntactic rules) first, then
      # the slimmed ESLint layer Biome cannot replicate — the spec-046
      # `alm/no-user-string` i18n rule (fails the build on any NEW hardcoded
      # user-facing string, SC-001/SC-002, gated through
      # scripts/check-eslint-baseline.mjs + eslint-alm-baseline.txt so
      # pre-existing violations drain via the refactor sweep instead of
      # blocking every PR), type-aware typescript-eslint, react-hooks,
      # jsx-a11y, and the inline-style ban — then stylelint, which is the only
      # tool in the repo that parses CSS (Biome's includes are scoped to
      # `src/**/*.{ts,tsx,js,jsx}`), then the design-token guard
      # (check-tokens.sh) and the i18n catalog lint
      # (check-i18n-catalog.mjs: raw `{code}` interpolation + duplicate
      # catalog values, same baseline-drain pattern).
      #
      # Linux-only: Biome, ESLint, stylelint and the token/i18n scripts read
      # `.ts`/`.tsx`/`.css`, all pinned to `eol=lf` in .gitattributes, so no rule
      # can reach a per-OS difference.
      - name: Frontend lint (Biome + ESLint gates + stylelint + tokens)
        if: runner.os == 'Linux' && needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @astro-plan/desktop run lint

      # `tests/` is outside the pnpm workspace globs (`apps/*`, `packages/*`),
      # so `pnpm -r lint` never reaches it and `apps/desktop/biome.json` scopes
      # itself to `src/**`. Without this step the E2E suite is unlinted and
      # unformatted. Runs off the root biome.json, which is scoped to `tests/**`
      # so it cannot shadow the nested desktop config.
      - name: Test-suite lint (Biome over tests/)
        if: runner.os == 'Linux' && needs.changes.outputs.frontend == 'true'
        run: pnpm run lint:tests

      # Formatting is OS-agnostic; running it on all 3 legs is pure redundancy.
      # `cargo fmt` only walks `mod` declarations, so it never reaches
      # bootstrap/specta.rs, which is `include!`d rather than `mod`-declared
      # (see that file's header). Check it explicitly so it cannot drift.
      - name: Rust format
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --all --check
          rustfmt --edition 2021 --check apps/desktop/src-tauri/src/bootstrap/specta.rs

      # Self-test the changed-crate scoping helper's mapping/closure logic
      # (runs once, on Linux, under the Rust lane).
      - name: Affected-crates helper self-test
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: bash scripts/ci-affected-crates.sh --self-test

      # DB boundary ratchet (parked in PR #384, wired in here): fails if raw
      # sqlx query/exec sites outside crates/persistence/db exceed the
      # checked-in baseline. Pure grep, no compile — runs once on Linux only
      # per the design doc's guidance (docs/development/persistence-layer-hardening.md).
      # Gated to run whenever Rust or scripts change (skipped on docs-only).
      - name: DB boundary ratchet
        if: runner.os == 'Linux' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true')
        run: just db-boundary

      # Dead-caller ratchet: fails if a module-level `pub fn` in crates/ has no
      # production caller. rustc's dead_code lint does not fire on `pub` items
      # in a lib crate, which is how #712, #879 and #943 shipped fully tested
      # but never invoked. Pure grep, no compile — same Linux-only gating as the
      # DB boundary ratchet above. The script self-tests its own detector before
      # reporting success, so a green result cannot be vacuous.
      - name: Dead-caller ratchet
        if: runner.os == 'Linux' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true')
        run: just dead-callers

      # Hot-read ratchet: fails if per-operation hot-read call sites in
      # crates/app/inbox/, crates/app/core/src/plan_apply/, and watcher.rs
      # exceed the checked-in baseline (GF-23/GF-24). Pure grep, no compile —
      # same Linux-only gating as the DB boundary and dead-caller ratchets.
      - name: Hot-read ratchet
        if: runner.os == 'Linux' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true')
        run: just hot-read

      # Lifecycle string-comparison ratchet: sealed at zero raw
      # `.lifecycle == "..."` comparisons in production Rust (#1534, #1556).
      # Local-only until now, so raw comparisons could reach main through CI.
      # Pure grep, no compile — same Linux-only gating as the ratchets above.
      - name: Lifecycle string ratchet
        if: runner.os == 'Linux' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true')
        run: just lifecycle-strings

      # Test-target declaration guard: every *.rs at the root of tests/contract/
      # must have a [[test]] entry. Cargo auto-discovery only reaches
      # `<pkg>/tests/*.rs`, so an undeclared file there compiles never and
      # asserts nothing — three sat that way for two months.
      - name: Test-target declaration guard
        if: runner.os == 'Linux' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true')
        run: just test-targets

      # .pv-* selector ratchet: sealed at zero class selectors in e2e test
      # files (Playwright TS under tests/e2e/ and Rust journeys under
      # crates/e2e-tests/), which the eslint alm/require-root-testid rule
      # cannot reach.
      #
      # Gated on rust/scripts only, NOT frontend: `just` is installed under the
      # rust lane alone, so a `|| frontend` clause here makes a PR touching only
      # apps/desktop/src/** run this step with no `just` on PATH. Both scanned
      # trees (tests/e2e/, crates/e2e-tests/) match the `rust` filter via
      # `tests/**` and `crates/**`, so the frontend clause added no coverage.
      - name: .pv-* selector ratchet
        if: runner.os == 'Linux' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true')
        run: just pv-selector-ratchet

      # Compilation warnings/lints are OS-agnostic; running clippy on all 3 legs
      # is pure redundancy — the nextest step below builds the workspace anyway.
      - name: Clippy (workspace, all targets, deny warnings)
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The default workspace clippy above never enables `dev-tools`, so the
      # developer-mode surface (apps/desktop/src-tauri/src/commands/dev.rs)
      # was linted by nobody and four lints rotted unseen (#1165). Release
      # binaries still omit `dev-tools` (see .claude/rules/21-astro-monorepo.md)
      # — this step only adds lint coverage for the daily developer build, it
      # does not touch the release build path. Same OS-agnostic reasoning as
      # the step above, so Linux-only here too.
      - name: Clippy (desktop_shell, dev-tools feature, deny warnings)
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: cargo clippy -p desktop_shell --features dev-tools --all-targets -- -D warnings

      # --- L1 (isolated units) + L2 (real-backend integration) ---
      # No standalone `cargo build --workspace` step: clippy --all-targets
      # (above, Linux) and nextest (below, every OS) each already build every
      # target they need, so a dedicated build step only duplicated work.
      # Clippy is Linux-only above, so Windows loses its only all-targets
      # compile check of non-test code ([[bin]]s, examples) — nextest only
      # builds through the cfg(test) harness. This repo has real history of
      # Windows-only bin-vs-test-binary divergence (tauri-build manifest
      # embed regression -> 0xc0000139), so restore cheap bin-target coverage
      # on Windows specifically. macOS stays descoped (no comparable history).
      - name: Windows workspace check (all targets)
        if: runner.os == 'Windows' && needs.changes.outputs.rust == 'true'
        run: cargo check --workspace --all-targets

      # Scope `cargo test` to the changed workspace members plus their
      # reverse-dependency closure (see scripts/ci-affected-crates.sh). Any
      # force_full trigger (Cargo.lock, workflows, …) or a rust-relevant file
      # outside every member yields the full-workspace fallback. Build/clippy
      # stay workspace-wide — conservative: when in doubt, run more.
      - name: Rust tests (L1+L2 — real SQLite, real migrations)
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        # CHANGED_FILES is passed via env (never interpolated into the script
        # body) so an attacker-crafted filename cannot inject shell commands.
        # nextest --profile ci: fail-fast off (report every failing leg), JUnit
        # output, and retries=2 scoped to the real-SQLite integration binaries
        # only (see .config/nextest.toml). Unit tests are not retried.
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.all_files }}
        run: |
          args=$(printf '%s' "$CHANGED_FILES" | tr ',' '\n' | bash scripts/ci-affected-crates.sh)
          if [ "$(printf '%s' "$args" | tr -d '[:space:]')" = "ALL" ] || [ -z "$(printf '%s' "$args" | tr -d '[:space:]')" ]; then
            echo "Running full workspace test suite."
            cargo nextest run --workspace --profile ci
          else
            echo "Running scoped tests for: $args"
            # --no-tests=pass: a scoped crate set can legitimately contain
            # zero runnable tests (e.g. an e2e_tests-only change — all its
            # tests are #[ignore]d for the Layer-2 e2e.yml job), and nextest
            # otherwise exits 4 ("no tests to run", run 28751553778).
            #
            # $args is a word list of `-p <crate>` flags and has to split, so the
            # SC2086 quote would collapse it into one bad argument.
            # shellcheck disable=SC2086
            cargo nextest run --profile ci --no-tests=pass $args
          fi

      # nextest does not run doctests; keep them in a dedicated step. Doctest
      # output is OS-agnostic, so Linux-only avoids running it 3x.
      - name: Rust doctests
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: cargo test --workspace --doc

      # Scope vitest to the specs that transitively import the changed modules.
      # `vitest related` resolves the real import graph, which is strictly more
      # accurate than a directory convention and needs no maintenance as files
      # move. Inputs the graph cannot see (runner config, setup file, global
      # styles, i18n catalogues, shared packages) set frontend_full and fall
      # back to the whole suite — see the `frontend_full` filter above.
      #
      # CHANGED_FILES is passed via env, never interpolated into the script
      # body, so a crafted filename cannot inject shell commands (same rule as
      # the Rust scoping step).
      # Linux-only: the suite runs under jsdom, and the only two specs that read
      # a platform (reveal-label.test.ts, SessionsPage.inventory.test.tsx) inject
      # a fake `navigator` rather than the host's. There are no snapshots and no
      # separator or line-ending assertions, so the macOS and Windows legs
      # produced an identical result for ~7.5 min each.
      - name: Frontend unit tests
        if: runner.os == 'Linux' && needs.changes.outputs.frontend == 'true'
        shell: bash
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.all_files }}
          FRONTEND_FULL: ${{ needs.changes.outputs.frontend_full }}
        run: |
          set -euo pipefail
          # Non-desktop workspaces run plain node scripts; they are cheap and
          # have no vitest graph, so they always run in full.
          #
          # The `!.` filter is load-bearing: `pnpm -r` excludes the workspace
          # root by default, but adding ANY --filter re-includes it. The root's
          # `test` script is `cargo test --workspace && pnpm -r --if-present
          # test`, so omitting `!.` makes this step run the entire Rust suite
          # inside a step named "Frontend unit tests" — which is how it was
          # first caught, as an app_core_calibration failure on macOS.
          pnpm --filter='!./apps/desktop' --filter='!.' -r --if-present test

          cd apps/desktop

          # `apps/desktop` declares `"pretest": "pnpm i18n:compile"`, and
          # `src/paraglide/` is gitignored, so the message catalogue only exists
          # once that runs. Invoking vitest through `pnpm exec` skips npm
          # lifecycle hooks, so pretest never fires and 145 of 199 spec files
          # fail on a missing `@/paraglide/messages`. Compile explicitly.
          pnpm i18n:compile

          if [ "$FRONTEND_FULL" = "true" ]; then
            echo "frontend_full=true -> running the complete vitest suite."
            pnpm exec vitest run
            exit 0
          fi

          # Changed files under this package, rebased to package-relative paths
          # and filtered to ones that exist (a deleted file has no dependents to
          # resolve and makes `vitest related` error).
          #
          # Read with `while read`, NOT `mapfile`: the macOS runner's /bin/bash
          # is 3.2 (Apple ships no GPLv3 bash), where `mapfile` does not exist.
          # It exits 127 and takes the whole step with it, so the frontend suite
          # never runs on macOS at all. The existence filter is folded into the
          # same loop rather than kept as a second pass over an intermediate
          # array — one loop cannot disagree with itself about which files it
          # collected.
          existing=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] && existing+=("$f")
          done < <(
            printf '%s' "$CHANGED_FILES" | tr ',' '\n' \
              | sed -n 's#^apps/desktop/##p' \
              | grep -E '^src/.*\.(ts|tsx)$' || true
          )

          if [ ${#existing[@]} -eq 0 ]; then
            echo "No existing apps/desktop/src TS files changed -> full suite (conservative)."
            pnpm exec vitest run
            exit 0
          fi

          echo "Running specs related to ${#existing[@]} changed file(s):"
          printf '  %s\n' "${existing[@]}"

          # `vitest related` prints "No test files found, exiting with code 0"
          # when a changed module has no dependent spec — a green result having
          # run nothing, which makes "the suite passed" and "the suite never
          # ran" indistinguishable. Treat that as unscopable and fall back to
          # the full suite rather than reporting a vacuous pass.
          set +e
          out=$(pnpm exec vitest related --run "${existing[@]}" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          if printf '%s' "$out" | grep -q 'No test files found'; then
            echo "::notice::vitest related selected no specs; running the full suite instead."
            pnpm exec vitest run
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # Linux-only: tsc resolves the same graph on every OS and emits no
      # platform-conditional diagnostics for this project.
      - name: TypeScript typecheck
        if: runner.os == 'Linux' && needs.changes.outputs.frontend == 'true'
        run: pnpm -r --if-present typecheck

      # Bundle-size budget gate: build the desktop bundle and fail if any
      # entry grows beyond the limits in apps/desktop/.size-limit.json.
      # Runs on Linux only (OS-agnostic output, no need to triple-run).
      # Placed after typecheck so type errors surface before a slow build.
      - name: Frontend build (for bundle-size gate)
        if: runner.os == 'Linux' && needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @astro-plan/desktop build

      - name: Bundle-size budget
        if: runner.os == 'Linux' && needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @astro-plan/desktop size

      # --- Generated contract / binding drift gate (review finding W1) ---
      # Regenerates Rust->TS bindings, contract schemas, and the
      # json-schema-to-typescript declarations, then fails on drift. Compiles
      # Rust, so it belongs to the Rust lane. Linux-only for the same reason as
      # clippy and the doctests above: the generator's output is OS-agnostic and
      # every file it writes is pinned to `eol=lf` in .gitattributes, so the
      # verdict cannot differ per platform.
      - name: Generated contract/binding drift
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: just check-generated

      # The release gate runs this too, but only on release-please branches and
      # tags, so a change that ships the dev surface would reach main unobserved.
      - name: Dev surface absent from a default-feature build
        # Rust-lane only: the check resolves the cargo feature graph, so it needs
        # the pinned toolchain that a scripts-only change does not install.
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: bash scripts/check-dev-surface-absent.sh

      # The declaration generator also reads `packages/contracts/schemas/` and
      # `specs/*/contracts/`, neither of which sets the `rust` filter. This leg
      # covers them without the Rust toolchain, system webkit, or cargo cache
      # that a frontend-only change does not install.
      - name: Contract declaration drift (no Rust)
        if: >-
          runner.os == 'Linux' && needs.changes.outputs.rust != 'true' &&
          (needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.spec_contracts == 'true')
        run: just check-contracts-ts

      # A frontend-only change leaves this leg with every step skipped on macOS
      # and Windows. The leg still has to report its required context, so say in
      # the log that nothing ran instead of letting a bare green imply the
      # platform was tested.
      - name: No platform-specific work on this leg
        if: runner.os != 'Linux' && needs.changes.outputs.rust != 'true'
        run: |
          echo "Only the frontend lane is active, and every frontend gate runs on ubuntu."
          echo "No tests ran on this leg, and none were applicable."

  # Required-check shim for the case where BOTH lanes are idle.
  #
  # `integration` above is a MATRIX job. When a matrix job is skipped by its
  # job-level `if`, GitHub never expands the matrix, so it publishes ONE check
  # named with the literal, uninterpolated string
  # `Unit + integration (L1+L2) — ${{ matrix.os }}`. The two contexts branch
  # protection actually requires — `… — ubuntu-latest` and `… — windows-latest`
  # — are therefore never created at all, and GitHub blocks the PR waiting for
  # checks that can never arrive. Not a red check: an absent one.
  #
  # This is invisible for almost every PR, because any Rust or frontend change
  # activates a lane. It bites exactly the changes that touch neither: a
  # docs-only PR, a workflow-only PR (e.g. adding a new .github/workflows/*.yml
  # file), or any other change that `decide` classifies as inert. #1313 sat
  # permanently unmergeable this way, and earlier tooling-only PRs were merged
  # by admin override rather than by satisfying the gate.
  #
  # The same problem applies to non-matrix single-lane jobs: `ui-e2e-gate`
  # below (which publishes the required "UI mock-mode (Playwright)" context)
  # uses `always()` so the context is always published with a definitive
  # conclusion. A plain `if: frontend == 'true'` job that skips publishes
  # `skipped`, which GitHub no longer accepts as satisfying a required check.
  #
  # This job runs whenever NEITHER lane is active — the exact complement of
  # `integration`'s job-level `if`. The matrix expands, the required contexts
  # are reported green, and the step output makes clear nothing was tested
  # rather than implying a suite passed. Every leg runs on ubuntu because it
  # executes no platform-specific work; the leg names exist to satisfy the
  # contexts, not to claim Windows coverage.
  #
  # Gated on `rust != 'true' && frontend != 'true'`, NOT on `docs_only`. The
  # two differ for workflow-only and config-only changes: `decide` recognises
  # those paths (they match no force_full_* and no domain filter), so it does
  # NOT activate either lane, but docs_only is false because no doc was touched.
  # Reporting green only for docs_only would leave workflow-only PRs stuck with
  # absent required contexts — the exact failure mode this shim exists to fix.
  # The unclassified-path catch-all in `decide` forces both lanes for truly
  # unknown paths, so rust==false && frontend==false can only occur for a change
  # the repo positively asserts is inert.
  integration-idle:
    name: Unit + integration (L1+L2) — ${{ matrix.os }}
    needs: changes
    if: >-
      needs.changes.outputs.rust != 'true' && needs.changes.outputs.frontend != 'true' &&
      needs.changes.outputs.spec_contracts != 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - name: No Rust or frontend changes to test
        env:
          RUST: ${{ needs.changes.outputs.rust }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          LEG: ${{ matrix.os }}
        run: |
          echo "Neither the Rust nor the frontend lane was triggered by this change."
          echo "rust=$RUST frontend=$FRONTEND docs_only=$DOCS_ONLY"
          echo "Reporting the required context for $LEG so the PR is mergeable."
          echo "No tests ran, and none were applicable."

  # Supply-chain gate: license compliance, duplicate-version policy, and security
  # advisories via cargo-deny. Runs on the Rust lane only (deny.toml + Cargo.lock
  # are both Rust artifacts). Linux-only: cargo-deny is OS-agnostic and running
  # it on three platforms is pure redundancy.
  supply-chain:
    name: Supply chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Cache the advisory DB so repeated runs do not re-fetch the full git
          # history; the action manages the cache key automatically.
          manifest-path: Cargo.toml

  # Perf regression gate (GF-6/C-9): checks that sqlx_stmts counts for the
  # inbox hot-path scenarios (scan_root, classify_source_groups) did not
  # increase relative to scripts/perf-baseline.json.
  #
  # Gating logic: ci-affected-crates.sh maps changed files to crate names.
  # The gate runs only when the output contains app_core_inbox, persistence_inbox,
  # or fs_inventory — the crates that implement the measured hot paths.  Any
  # change to Cargo.lock or Cargo.toml triggers the full workspace, which also
  # captures these crates, so the grep catches that path too.  Skipped when
  # none of those crates are affected (docs-only, frontend-only, etc.).
  #
  # Linux-only: the sqlx_stmts counter is deterministic so the result is
  # OS-agnostic; running on one platform avoids redundant compilation on all 3.
  perf-gate:
    name: Perf baseline (inbox hot paths)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2

      # Scope gate: only run when a change touches the measured crates.
      # CHANGED_FILES uses the same CSV-then-newline pattern as the Rust tests step.
      - name: Check affected crates
        id: affected
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.all_files }}
        run: |
          args=$(printf '%s' "$CHANGED_FILES" | tr ',' '\n' | bash scripts/ci-affected-crates.sh)
          if printf '%s' "$args" | grep -qE 'app_core_inbox|persistence_inbox|fs_inventory'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Affected crates include inbox/fs_inventory — running perf gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No inbox or fs_inventory crates affected — perf gate skipped."
          fi

      - name: Perf baseline ratchet
        if: steps.affected.outputs.run == 'true'
        env:
          PERF_N: "500"
        run: bash scripts/check-perf-baseline.sh

  # Mock-mode UI regression: fast Playwright run (Vite + chromium, mocks on, no
  # backend/Tauri build). The real UI->IPC->backend journeys run in the dedicated
  # WebdriverIO + tauri-driver workflow (e2e.yml). Not gated on `integration` so
  # UI regressions surface even when the Rust workspace gate is unrelatedly red.
  # Single-lane job: every step is frontend work, so the whole job is gated on
  # the frontend lane and a change that cannot affect the frontend skips it
  # outright rather than reporting a green check for an empty run.
  ui-e2e:
    name: UI mock-mode (Playwright) — run
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm --filter @astro-plan/desktop exec playwright install --with-deps chromium
      - name: Mock-mode UI tests
        run: pnpm --filter @astro-plan/desktop test:e2e

  # Gate for the mock-mode Playwright job. Published as "UI mock-mode (Playwright)"
  # — the context required by branch protection.
  #
  # `ui-e2e` above skips when the frontend lane is idle (docs-only PR). A
  # `skipped` conclusion does NOT satisfy a required check on GitHub — only
  # `success` does. Splitting the actual work (`ui-e2e`) from the required-context
  # gate (`ui-e2e-gate`) lets the gate always report `success` on a legitimate
  # skip while still reporting `failure` when `ui-e2e` fails or is unexpectedly
  # absent. The run check lives in the step so the `if: always()` keeps this
  # job reporting a definitive conclusion on every PR regardless of the lane.
  ui-e2e-gate:
    name: UI mock-mode (Playwright)
    needs: [changes, ui-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Playwright result
        env:
          RESULT: ${{ needs.ui-e2e.result }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          echo "ui-e2e result: $RESULT"
          echo "frontend lane active: $FRONTEND"
          if [ "$FRONTEND" != 'true' ]; then
            echo "Frontend lane idle — Playwright appropriately skipped."
            exit 0
          fi
          [ "$RESULT" = "success" ] || exit 1

  # Dead-caller ratchet — main-push guard.
  #
  # The `integration` job (above) evaluates the dead-caller ratchet only when
  # the Rust or scripts lane is active. On a main push that touches neither
  # (docs, workflow edits, spec files) the `integration` job is skipped via
  # its job-level `if:`, and the ratchet never runs. A dead `pub fn` that
  # landed via such a merge is then invisible until the next Rust-touching PR,
  # where it fires on an unrelated author.
  #
  # This job closes that window by evaluating the ratchet against main after
  # every merge, regardless of which paths changed. It is gated to main pushes
  # only (`github.event_name == 'push'`) so it does not double-run alongside
  # `integration` on Rust-touching PRs.
  #
  # The check is pure grep (no Rust toolchain, no compile) — just checkout +
  # `just` — so it adds negligible wall-clock time to the post-merge queue.
  # It is NOT a branch-protection required check; it is a canary that surfaces
  # accumulated debt on main before it can block a contributor's PR.
  dead-caller-main:
    name: Dead-caller ratchet (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 2: on a main push `origin/main` is the commit just pushed, so
      # the tracking check would compare the baseline against itself. It falls
      # back to HEAD~1, which the default depth-1 checkout does not contain, and
      # the check fails closed under CI.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Dead-caller ratchet
        run: just dead-callers
