[package]
name = "fs_executor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
domain_core = { path = "../../domain/core" }
fs_pathsafe = { path = "../pathsafe" }
# write_manifest renders the app-owned project marker via the domain-owned
# `render_marker` (astro-plan-l3y0) instead of duplicating its JSON shape here.
project_structure = { path = "../../project/structure" }
camino = { workspace = true }
serde.workspace = true
tokio = { workspace = true }
tracing.workspace = true
time.workspace = true
trash.workspace = true
# spec 042 (T206): purely-lexical `.`/`..` collapse for the path-resolution
# gate (replaces the hand-rolled component walk; symlink-safety is unchanged).
path-clean.workspace = true
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
# Preserve source mtime after cross-volume copy (constitution §II archival fidelity).
filetime = "0.2"
# Atomic temp+rename for cross-volume copy and marker write (GF-3/27).
tempfile.workspace = true
hex.workspace = true
sha2.workspace = true
uuid = { workspace = true }

[features]
# Compiles the `run::loop_::pacing` seam, which parks the forward pass at each
# item boundary so a test can file a mid-run retry, pause, or cancel while the
# run provably still holds an open retry queue.
# Default off, so a release binary has no way to stall a real plan apply.
# Enabled through the `[dev-dependencies]` edge of the crate whose tests need it,
# never from a `[dependencies]` edge.
# `tokio/time` is the arrival timeout that turns a broken ordering into a test
# failure rather than a hang.
test-pacing = ["tokio/time"]
# Compiles the `ops::trash_op::fake` seam, which diverts OS trash to a plain
# file removal so headless e2e runs do not block on an interactive Shell trash.
# Default off, so a release binary carries no way to divert the destructive path
# of a real plan apply. Reached through `app_core/e2e-trash-fake` (itself reached
# only from `desktop_shell/e2e`) or a `[dev-dependencies]` edge, never from a
# release `[dependencies]` edge.
e2e-trash-fake = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
