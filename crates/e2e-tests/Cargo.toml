[package]
name = "e2e_tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The library target holds only std-only per-instance allocation; the heavy
# thirtyfour WebDriver stack stays a dev-dependency, compiled only for the test
# binaries and never by `cargo build --workspace` of the shipping crates.
[lib]
path = "src/lib.rs"

# Journey-driving launch helper, declared rather than auto-discovered so it is
# visible in the manifest next to the lib whose allocation it shares.
[[bin]]
name = "journey-instance"
path = "src/bin/journey-instance.rs"

[dev-dependencies]
# W3C WebDriver client (spec 037 adopted stack — see rust.tauri steering).
thirtyfour = "0.37"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
# Disposable roots/project folders for real-file journey fixtures (never a DB
# reader/writer — see `common/mod.rs` module docs on that boundary).
tempfile = { workspace = true }
# `lifecycle.transition.apply`'s requestId is a real `Uuid` (contracts_core::
# lifecycle::TransitionRequest), unlike most other request ids (plain
# String) — a hand-crafted non-hex placeholder fails IPC deserialization.
uuid = { workspace = true }
# Pre-warm the resolve cache once per shard to eliminate the 13k-row seed
# load from every individual E2E app boot (bead astro-plan-v84u).
targeting_resolver = { path = "../targeting/resolver" }
simbad-resolver = "0.5.0"
