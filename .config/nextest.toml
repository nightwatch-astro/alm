# Nextest configuration for spec 037 Layer-2 real-UI E2E journeys.
#
# Run the E2E suite with:
#   cargo nextest run -p e2e_tests --profile e2e --run-ignored all
#
# (`--run-ignored all` because the journeys are `#[ignore]`d in-source so the
# Layer-1 `cargo test --workspace` job — no tauri-webdriver CLI, no
# e2e-feature app build, no served frontend — skips them.)
#
# The "e2e" profile runs a bounded number of journeys concurrently, a
# generous per-test timeout, one automatic retry, and immediate-final failure
# output so the first broken journey is visible without scrolling.
#
# Each journey (nextest test) is its own OS process with its own ephemeral
# tauri-webdriver ports, isolated app-data/config dirs, and its own SQLite
# file (`crates/e2e-tests/tests/common/mod.rs::InstanceEnv`) — concurrent
# journeys no longer race each other over shared :4444/:4445 ports or a
# shared DB file.
#
# `test-threads` was pinned at 1 despite that isolation because of a second,
# product-code collision: `tauri_plugin_single_instance::init()`
# (`apps/desktop/src-tauri/src/lib.rs`) registers ONE identity derived from
# the app identifier + version, with a per-instance override available only on
# Linux (`dbus_id`) — not Windows (named mutex) or macOS. Two concurrent
# `desktop_shell` instances collide on that identity; the loser is silently
# redirected to the winner and never opens its own window, so its WebDriver
# plugin server never comes up (observed deterministically as
# `WebDriver session not created` on the SAME journey slot across both nextest
# retries — on ubuntu, CI runs 29593925067/29592400990, and on the windows
# shard, run 29603000039 — while sibling journeys booted normally).
#
# Fixed by skipping the single-instance plugin entirely under e2e (the only
# cross-platform fix, since Windows/macOS have no per-instance override, and no
# journey exercises single-instance behaviour): the harness sets
# `ALM_E2E_INSTANCE_ID` per test process (`crates/e2e-tests/tests/common/
# mod.rs::spawn_tauri_webdriver`), and `apps/desktop/src-tauri/src/lib.rs`
# omits the plugin when that env var is present — a no-op for real users/non-e2e
# builds, where the var is never set and the guard stays registered.
#
# `test-threads = 2` (not higher): CI runners are 4-core, and each journey
# boots a debug-build WebKitGTK/WebView2 app + SQLite migrate + ~13k-row
# target-seed load (see `LAUNCH_TIMEOUT`'s docs) — 2 concurrent boots is the
# contention CI was already tuned for (the 240s `LAUNCH_TIMEOUT` bump in
# PR #951 assumed exactly this), and this fix's own verification run is the
# first real evidence for going further.

[profile.e2e]
test-threads = 2

# Warn every 60 s; terminate after 5 periods (300 s). Must exceed the
# harness's LAUNCH_TIMEOUT (240 s — slow/contended debug-build app boot on CI
# runners, see crates/e2e-tests/tests/common/mod.rs) plus in-journey polling.
slow-timeout = { period = "60s", terminate-after = 5 }

# Retry once to guard against transient driver/startup flakes.
retries = 1

# Run every journey even when one fails: with fail-fast (the default) a single
# failure cancels the remaining serial tests, hiding their results from CI
# (run 28694907445 reported "1/6 tests run" with no signal for the other 5).
fail-fast = false

# Print failures immediately and again at the end for easy scanning.
failure-output = "immediate-final"

# Windows-latest CI runners are chronically the closest to the slow-timeout
# edge (debug-build WebView2 boot + intermittent runner-level stalls; even
# green CI runs there show 1-3 retried flakes recovering by luck). The single
# retry below buys margin against a runner stall without masking a real
# regression, since a genuinely broken journey fails both attempts. It also
# keeps a recovered flake VISIBLE as `(N flaky)` rather than absorbing it --
# see the budget note further down for why that visibility is the point.
#
# `threads-required = 2` makes each Windows journey occupy the whole
# `test-threads = 2` budget, i.e. Windows runs one journey at a time while
# ubuntu/macOS keep running two.
#
# Why (#1204): the note above claims concurrent journeys have "isolated
# app-data/config dirs". That is true on Linux (`XDG_*`) and macOS (`HOME`),
# and **false on Windows**. `InstanceEnv::new` sets `APPDATA`/`LOCALAPPDATA`,
# but Tauri resolves those directories through `dirs`, which on Windows calls
# `SHGetKnownFolderPath(FOLDERID_RoamingAppData)` (`dirs-sys-0.5.0/src/lib.rs`)
# — the Known Folder API ignores both environment variables outright. So every
# concurrent instance shares the real `C:\Users\runneradmin\AppData\…`.
#
# Observed end-to-end in main run 29734205501, `windows-latest 1/2`, in the
# driver log that #1262 started surfacing:
#
#   WARN resolve_cache: Database already open. Cannot acquire lock.
#         path=…\AppData\Roaming\…\simbad-cache.redb          <- 2nd instance
#   ERROR tauri_runtime_wry: failed to create webview:
#         WebView2 error: WindowsError(HRESULT(0x80070057))   <- shared UDF
#   Error serving connection: … target machine actively refused it (10061)
#   Error: window.__ALM_E2E__ bridge never became ready within 30s
#
# No webview means no window, so the plugin's WebDriver port never serves and
# every proxy request is refused — which is the bare "bridge never became
# ready" this file's readers have been chasing since #1019.
#
# This is the *same class* of bug as the single-instance collision documented
# above, which was also Windows/macOS-only for the same reason: per-instance
# isolation that exists on Linux and silently does not on Windows.
#
# Update: real per-instance webview isolation landed (`WEBVIEW2_USER_DATA_FOLDER`,
# `crates/e2e-tests/tests/common/mod.rs::InstanceEnv::new` +
# `apps/desktop/src-tauri/src/data_dir.rs`) — the redb-lock and shared-webview
# collisions above should no longer happen regardless of `threads-required`.
# Update 2026-07-30: `retries` lowered 2 -> 1 to find out whether the
# contamination symptom is still there. At `retries = 2` a green Windows shard
# was not evidence of a clean first attempt, so the symptom could neither be
# observed nor declared gone — the retry budget was hiding the very signal
# needed to decide. `astro-plan-1oe` records per-shard TRY-1 output from PR
# #1465 (jobs 89248442052 / 89248442207 plus reruns) with no flaky suffix on
# either shard, so the isolation fix does appear to hold.
#
# `retries = 1` keeps one attempt of headroom for a per-test stall -- the
# slow-timeout edge described above -- while making a second-attempt pass
# visible as `(N flaky)` instead of silently absorbed. That visibility is the
# whole point of choosing 1 over 2.
#
# It does NOT cover the runner-image faults tracked by `astro-plan-gl5q`
# (STATUS_DLL_INIT_FAILED / 0xC0000142). Those kill the harness process during
# init, before any test starts, so nextest has no test to retry and the retry
# budget is orthogonal to them. `gl5q` asks for exit-code detection, not
# retries: a step that recognises 0xC0000142, or any exit with zero test output,
# and reports "runner failure, re-run". That work is unstarted; do not read this
# retry budget as protection against it.
#
# If flakes return, that is the answer: raise it back to 2 and reopen the
# contamination investigation with the shard logs as evidence.
# `threads-required = 2` stays: the comment above gates lowering it on a real
# Windows run under `test-threads > 1`, and that has not happened.
[[profile.e2e.overrides]]
platform = 'cfg(windows)'
retries = 1
threads-required = 2

# ---------------------------------------------------------------------------
# CI profile for the Layer-1 workspace test run (spec: build/adopt-nextest).
#
# Used by CI via `cargo nextest run --workspace --profile ci`. Local `just test`
# uses the built-in "default" profile (fail-fast on, no retries, no JUnit).
# ---------------------------------------------------------------------------
[profile.ci]
# Report every failing test in one run instead of stopping at the first, so a
# broken CI matrix leg shows the full failure set (matches the workspace
# `cargo test` behaviour this profile replaces, which ran all test binaries).
fail-fast = false

# Print failures immediately and again in a trailing summary for easy scanning
# of long CI logs.
failure-output = "immediate-final"

# Machine-readable results for CI test reporters. Written to
# `target/nextest/ci/junit.xml`.
[profile.ci.junit]
path = "junit.xml"

# The persistence_core/app_core/targeting_resolver integration tests previously
# carried retries=2 to mask two timing-race flake sources:
#   1. persistence_core/tests/wal_journal_mode.rs: the WAL unblocked-reader test
#      used a wall-time assertion (elapsed < 300 ms) that Tokio scheduler
#      latency on loaded CI runners could exceed. Fixed by asserting ordering
#      (reader_finished_at < writer_released_at) instead of wall time.
#   2. app_core/tests: ~39 fixed sleep() calls used as synchronization barriers
#      after apply_plan / resume_plan / publish_applied. Fixed by replacing each
#      with support::wait_plan_terminal / support::poll_until (25 ms poll, 2 s cap).
# With both root causes removed, retries are no longer needed here.
# Unit tests (kind(lib)) are still deliberately NOT retried.
# See: PR test/replace-timing-race-assertions-with-observable-condition-waits
